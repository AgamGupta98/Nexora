<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#b055ff" />
    </linearGradient>

    <linearGradient id="purple-flare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#b055ff" />
    </linearGradient>

    <radialGradient id="core-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Cyber Shield Hexagon -->
  <polygon points="100,12 176,55 176,145 100,188 24,145 24,55"
           fill="rgba(10, 18, 38, 0.7)"
           stroke="url(#cyan-blue)"
           stroke-width="2.5"
           filter="url(#neon-glow)" />

  <!-- Inner Concentric Circuit Ring -->
  <circle cx="100" cy="100" r="68"
          fill="none"
          stroke="rgba(0, 240, 255, 0.25)"
          stroke-width="1.5"
          stroke-dasharray="8 6 16 4" />

  <!-- Orbital Node Markers -->
  <circle cx="100" cy="32" r="3.5" fill="#00f0ff" filter="url(#neon-glow)" />
  <circle cx="168" cy="100" r="3.5" fill="#00ffaa" filter="url(#neon-glow)" />
  <circle cx="100" cy="168" r="3.5" fill="#b055ff" filter="url(#neon-glow)" />
  <circle cx="32" cy="100" r="3.5" fill="#00f0ff" filter="url(#neon-glow)" />

  <!-- Core Energy Radial Pulse -->
  <circle cx="100" cy="95" r="26" fill="url(#core-flare)" />

  <!-- Center Stylized NEXORA OMEGA Symbol (Ω) -->
  <path d="M 68 136
           L 82 136
           C 85 136, 88 132, 87 127
           C 82 108, 80 94, 88 80
           C 94 70, 106 70, 112 80
           C 120 94, 118 108, 113 127
           C 112 132, 115 136, 118 136
           L 132 136"
        fill="none"
        stroke="url(#purple-flare)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neon-glow)" />

  <!-- Crossbar Core Emitter -->
  <circle cx="100" cy="96" r="5" fill="#ffffff" filter="url(#neon-glow)" />
</svg>
